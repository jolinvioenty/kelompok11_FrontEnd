<!DOCTYPE html>

<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- judul tab browser (nanti diganti oleh React sesuai halaman yang dibuka) -->
  <title>Katalog Menu - Kantin Sahera Pak Kirno</title>
